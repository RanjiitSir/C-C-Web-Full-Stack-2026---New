<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tables in HTML</title>
    <style>
        caption
        {
            border: 2px solid rgb(24, 113, 34);
        }

        table
        {
            border: 3px solid rgb(0, 191, 255);
        }

        td, th
        {
            border: 1px solid rgb(12, 12, 12);
        }

    </style>
</head>
<body>
    <table>
        <caption>Numeric</caption>
        <tr>
            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
        </tr>
        <tr>
            <td>11</td>
            <td>22</td>
            <td>33</td>
            <td>44</td>
        </tr>
        <tr>
            <td>21</td>
            <td>31</td>
            <td>41</td>
            <td>51</td>
        </tr>
        <tr>
            <td>10</td>
            <td>20</td>
            <td>30</td>
            <td>40</td>
        </tr>
    </table>
</body>
</html>
