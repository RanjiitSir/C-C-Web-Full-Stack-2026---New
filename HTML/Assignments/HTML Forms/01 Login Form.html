<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login Form</title>
        <style>
                .LoginForm
                {
                    text-align: center;
                }

                button
                {
                    color: brown; 
                    padding: 10px;
                }
        </style>
    </head>
    <body>
        <div class="LoginForm">
                 <h2>User Login Form</h2>

                <label for="">Username : </label>
                <input type="Text" name="ip_Uname" placeholder="Enter Username">

                <br>
                <br>
                <label for="">Password : </label>
                <input type="password" name="ip_Pass" placeholder="Enter Correct Password" >

                <br>
                <br>

                <button type="submit">Login</button>
        </div>
    </body>
</html>
