<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Basics</title>
    <style>
        caption
        {
            border: 2px solid rgb(4, 117, 6);
        }
        table
        {
            border: 3px solid rgb(117, 4, 4);
        }
        td, th
        {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <caption>Student Table</caption>
        <tr>
            <th>Roll No.</th>
            <th>Student Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Amey Wagh</td>
            <td>B.Tech in CSE</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Harry Potter</td>
            <td>Doctor</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Karan Johar</td>
            <td>Hotel management</td>
        </tr>
        
    </table>
</body>
</html>
